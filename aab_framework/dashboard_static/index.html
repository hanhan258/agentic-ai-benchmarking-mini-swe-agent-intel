<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AAB Dashboard</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">AAB</div>
        <div>
          <h1>Agentic Benchmark</h1>
          <p>Mini SWE Agent dashboard</p>
        </div>
      </div>

      <section class="panel compact">
        <div class="panel-title">Runs</div>
        <select id="runSelect" class="control"></select>
        <button id="refreshButton" class="button secondary" type="button">Refresh</button>
      </section>

      <section class="panel compact">
        <div class="panel-title">Start Sweep</div>
        <div class="split-fields">
          <label>Workload<select id="workloadSelect" class="control"></select></label>
          <label>Runtime<select id="runtimeSelect" class="control"></select></label>
        </div>
        <label>Agents</label>
        <input id="agentsInput" class="control" value="1 2 4 8 16 32 64 128">
        <div class="split-fields">
          <label>Context tokens<input id="contextLengthInput" class="control" type="number" value="4096" min="1024"></label>
          <label>Parallelism<input id="parallelismInput" class="control" type="number" value="4" min="1"></label>
        </div>
        <div class="split-fields">
          <label>Adapter<select id="adapterModeSelect" class="control">
            <option value="mock">mock</option>
            <option value="cli">cli</option>
          </select></label>
          <label>Name<input id="runNameInput" class="control" value="manual"></label>
        </div>
        <div class="split-fields">
          <label>Model<input id="modelInput" class="control" value="DeepSeek-V4-Flash"></label>
          <label>Mini command<input id="miniCommandInput" class="control" value="mini"></label>
        </div>
        <label>vLLM base URL</label>
        <input id="vllmBaseUrlInput" class="control" value="http://127.0.0.1:4000/v1">
        <div class="split-fields">
          <label>Task source<select id="taskSourceSelect" class="control">
            <option value="synthetic">synthetic</option>
            <option value="local">local</option>
          </select></label>
          <label>Workspace<select id="workspaceModeSelect" class="control">
            <option value="worktree">worktree</option>
            <option value="copy">copy</option>
            <option value="source">source</option>
          </select></label>
        </div>
        <label>Repo source</label>
        <input id="repoSourceInput" class="control" placeholder="/home/user/repos/django">
        <label>Task</label>
        <input id="taskInput" class="control" placeholder="Inspect the repo and fix a focused issue">
        <label>Verify command</label>
        <input id="verifyCommandInput" class="control" placeholder="python -m pytest tests/path">
        <label class="check-row"><input id="repoContextEnabledInput" type="checkbox"> Repo context</label>
        <label class="check-row"><input id="gitHistoryInput" type="checkbox"> Git history scan</label>
        <label class="check-row"><input id="pytestCollectInput" type="checkbox"> Pytest collection</label>
        <label>Password</label>
        <input id="sudoInput" class="control" type="password" placeholder="Uses server env if empty">
        <div class="actions">
          <button id="startButton" class="button primary" type="button">Start</button>
          <button id="stopButton" class="button danger" type="button">Stop</button>
        </div>
        <p id="startMessage" class="muted"></p>
      </section>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h2 id="runTitle">Loading...</h2>
          <p id="runPath" class="muted"></p>
        </div>
        <div id="statusBadge" class="badge">checking</div>
      </header>

      <section class="kpi-grid">
        <div class="kpi"><span>Max Agents</span><strong id="kpiMaxAgents">-</strong></div>
        <div class="kpi"><span>Best Stable</span><strong id="kpiStable">-</strong></div>
        <div class="kpi"><span>Completed</span><strong id="kpiCompleted">-</strong></div>
        <div class="kpi"><span>Failed</span><strong id="kpiFailed">-</strong></div>
        <div class="kpi"><span>Peak Throughput</span><strong id="kpiThroughput">-</strong></div>
      </section>

      <section class="panel">
        <div class="panel-title">Business Performance</div>
        <canvas id="businessChart" height="280"></canvas>
      </section>

      <section class="panel">
        <div class="panel-title">CPU Metrics</div>
        <canvas id="cpuChart" height="260"></canvas>
      </section>

      <section class="metrics-section">
        <div class="section-title">GPU Metrics</div>
        <div class="grid two">
          <div class="panel">
            <div class="panel-title">GPU Utilization</div>
            <canvas id="gpuUtilChart" height="260"></canvas>
          </div>
          <div class="panel">
            <div class="panel-title">GPU Memory</div>
            <canvas id="gpuMemoryChart" height="260"></canvas>
          </div>
        </div>
      </section>

      <section class="panel">
        <div class="panel-title">Sweep Results</div>
        <div id="resultsTable" class="table-wrap"></div>
      </section>

      <section class="grid two">
        <div class="panel">
          <div class="panel-title">Agent Team</div>
          <div id="teamTable" class="table-wrap"></div>
        </div>
        <div class="panel">
          <div class="panel-title">Issues</div>
          <div id="issueTable" class="table-wrap"></div>
        </div>
      </section>

      <section class="panel">
        <div class="panel-title">Failures</div>
        <div id="failureList" class="failure-list"></div>
      </section>

      <section class="panel logs-panel">
        <div class="panel-title row-title">
          <span>Logs</span>
          <span>
            <select id="pointSelect" class="control small"></select>
            <button id="loadLogButton" class="button secondary" type="button">Load Log</button>
            <button id="loadDashboardLogButton" class="button secondary" type="button">Sweep Process</button>
          </span>
        </div>
        <pre id="logView">No log loaded.</pre>
      </section>
    </main>
  </div>

  <script src="/app.js"></script>
</body>
</html>
